# TEMPLATE ONLY: NOT YET VALIDATED FOR PRODUCTION.
# Replace POOL_NAME and TAPE_DEVICE_* with your own TrueNAS settings.
# Requires a public GHCR package and host tape mount propagation configured.
# WARNING: Docker socket access grants host-level control. Trusted administrators only.
services:
  manager:
    image: ghcr.io/geraldjust/ltfs-tape-manager:1.2.0.2
    container_name: ltfs-simple-manager
    restart: unless-stopped
    pid: host
    ports:
      - "8081:8080"
    devices:
      - "/dev/TAPE_DEVICE_SG:/dev/TAPE_DEVICE_SG:rwm"
      - "/dev/TAPE_DEVICE_NST:/dev/TAPE_DEVICE_NST:rwm"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/POOL_NAME/LTFS:/tape:rslave
      - /mnt/POOL_NAME/LTFS-READ:/destination:rw
      - /mnt/POOL_NAME/LTFS-WRITE:/write-source:ro
      - /mnt/POOL_NAME/LTFS-Manager/simple-state:/state-simple:rw
    environment:
      HOST_TAPE_PATH: /mnt/POOL_NAME/LTFS
      HOST_READ_PATH: /mnt/POOL_NAME/LTFS-READ
      HOST_WRITE_PATH: /mnt/POOL_NAME/LTFS-WRITE
      SG_DEVICE: /dev/TAPE_DEVICE_SG
      NST_DEVICE: /dev/TAPE_DEVICE_NST
      LTFS_MANAGER_NAME: ltfs-simple-manager
      LTFS_WORKER_NAME: aurora-ltfs
      AURORA_IMAGE: ghcr.io/auroratape/aurora-ltfs:1.0.0
    security_opt:
      - no-new-privileges:true

name: Publish Docker image

on:
  push:
    branches: [main, '1.5', '1.6']
    paths:
      - 'app.py'
      - 'archive_catalog.py'
      - 'archive_registration.py'
      - 'archive_scan.py'
      - 'static/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'tar_planning.py'
      - 'tar_runtime.py'
      - 'test_tar_runtime.py'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python and TAR tests
        run: |
          python -m py_compile app.py archive_catalog.py archive_registration.py archive_scan.py archive_sync.py tar_planning.py tar_runtime.py
          python -m unittest -v test_tar_runtime.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/geraldjust/ltfs-tape-manager:1.6.0.5-dev
          labels: |
            org.opencontainers.image.source=https://github.com/geraldjust/ltfs-tape-manager
            org.opencontainers.image.version=1.6.0.5-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

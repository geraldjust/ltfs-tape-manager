name: Publish Docker image

on:
  push:
    branches: [main, '1.5', '1.6']
    paths:
      - 'app.py'
      - 'static/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/geraldjust/ltfs-tape-manager:${{ github.ref_name == '1.6' && '1.6.8' || '1.5.0.0' }}
            ghcr.io/geraldjust/ltfs-tape-manager:${{ github.ref_name == '1.6' && '1.6-dev' || '1.5-dev' }}
          labels: |
            org.opencontainers.image.source=https://github.com/geraldjust/ltfs-tape-manager
            org.opencontainers.image.version=${{ github.ref_name == '1.6' && '1.6.8' || '1.5.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

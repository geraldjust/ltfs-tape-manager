# LTFS Tape Manager v1.5.0 — TrueNAS SCALE Custom App YAML
# TrueNAS: Apps > Discover Apps > Install via YAML.
#
# IMPORTANT: "Pool1" is an EXAMPLE pool name. Replace EVERY /mnt/Pool1/
# occurrence below with /mnt/YOUR-POOL-NAME/ for your TrueNAS system.
#
# Create these paths BEFORE installing (datasets or ordinary directories):
#   /mnt/Pool1/LTFS-Manager/
#   /mnt/Pool1/LTFS-Manager/simple-state-1.5/
#   /mnt/Pool1/LTFS-Manager/tape/
#   /mnt/Pool1/LTFS-WRITE/
#   /mnt/Pool1/LTFS-READ/
# Both simple-state-1.5 and tape MUST be INSIDE LTFS-Manager.
# The tape directory must be empty before mounting. Do not make it a
# separate ZFS dataset; it is an ordinary directory used as a FUSE mountpoint.
# Docker validates bind sources before starting services; it cannot rely on
# an init container to create these paths during the initial deployment.
# Do not chmod/chown NFSv4 ACL-protected TrueNAS paths.
#
# Confirm the tape devices with: sudo lsscsi -g
# /dev/sg1 and /dev/nst0 below are examples; change BOTH environment
# variables and BOTH devices entries if your drive uses different paths.
# Install as a TrueNAS Custom App named ltfs-tape-manager-1-5.
# Stop other tape managers before using this drive. The manager creates
# and removes its Aurora LTFS worker on demand; do not add another service.
services:
  ltfs-tape-manager-1-5:
    image: ghcr.io/geraldjust/ltfs-tape-manager:1.5.0
    container_name: ltfs-manager-1-5
    restart: unless-stopped
    privileged: true
    ports:
      - "8084:8080"
    environment:
      HOST_TAPE_PATH: /mnt/Pool1/LTFS-Manager/tape
      HOST_WRITE_PATH: /mnt/Pool1/LTFS-WRITE
      HOST_READ_PATH: /mnt/Pool1/LTFS-READ
      SG_DEVICE: /dev/sg1
      NST_DEVICE: /dev/nst0
      AURORA_IMAGE: ghcr.io/auroratape/aurora-ltfs:1.5.0
      LTFS_WORKER_NAME: aurora-ltfs-1-5
      LTFS_MANAGER_NAME: ltfs-manager-1-5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /mnt/Pool1/LTFS-Manager/tape
        target: /tape
        bind:
          propagation: rshared
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/LTFS-WRITE
        target: /write-source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/LTFS-READ
        target: /destination
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/LTFS-Manager/simple-state-1.5
        target: /state-simple
        bind:
          create_host_path: false
    devices:
      - /dev/sg1:/dev/sg1:rwm
      - /dev/nst0:/dev/nst0:rwm
    security_opt:
      - apparmor:unconfined

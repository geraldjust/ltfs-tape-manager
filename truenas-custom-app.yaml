# LTFS Tape Manager v1.2.0.5 — TrueNAS SCALE Custom App YAML
# In TrueNAS: Apps > Discover Apps > Install via YAML.
# Edit the four /mnt/Pool1 paths and tape device paths to match your system.
# The manager creates/removes the Aurora LTFS worker on demand;
# do NOT add a second permanent Aurora service.
services:
  ltfs-tape-manager:
    image: ghcr.io/geraldjust/ltfs-tape-manager:1.2.0.5
    container_name: ltfs-simple-manager
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    environment:
      HOST_TAPE_PATH: /mnt/Pool1/LTFS
      HOST_WRITE_PATH: /mnt/Pool1/LTFS-WRITE
      HOST_READ_PATH: /mnt/Pool1/LTFS-READ
      SG_DEVICE: /dev/sg2
      NST_DEVICE: /dev/nst0
      AURORA_IMAGE: ghcr.io/auroratape/aurora-ltfs:1.0.0
      LTFS_WORKER_NAME: aurora-ltfs
      LTFS_MANAGER_NAME: ltfs-simple-manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /mnt/Pool1/LTFS
        target: /tape
        bind:
          propagation: rshared
      - type: bind
        source: /mnt/Pool1/LTFS-WRITE
        target: /write-source
        read_only: true
      - type: bind
        source: /mnt/Pool1/LTFS-READ
        target: /destination
      - type: bind
        source: /mnt/Pool1/LTFS-Manager/simple-state
        target: /state-simple
        bind:
          create_host_path: true
    devices:
      - /dev/sg2:/dev/sg2:rwm
      - /dev/nst0:/dev/nst0:rwm
    security_opt:
      - apparmor:unconfined
